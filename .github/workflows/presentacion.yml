name: Actualizar presentación del estudio de mercado

# Cada vez que se sube una nueva versión del Excel, se regenera la presentación.
on:
  push:
    paths:
      - "Estudio_Mercado_Rural_Puente_Bomba_Tigreras.xlsx"
      - "generar_presentacion.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generar presentación (recalcula con LibreOffice si el Excel no trae resultados guardados)
        run: |
          XLSX=Estudio_Mercado_Rural_Puente_Bomba_Tigreras.xlsx
          if ! python generar_presentacion.py "$XLSX"; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc
            mkdir recalculado && soffice --headless --convert-to xlsx --outdir recalculado "$XLSX"
            python generar_presentacion.py "recalculado/$XLSX"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: presentacion
          path: Presentacion_Estudio_Mercado_Rural.pptx
      - name: Guardar la presentación en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Presentacion_Estudio_Mercado_Rural.pptx
          git diff --cached --quiet || (git commit -m "Actualizar presentación desde el Excel" && git push)
